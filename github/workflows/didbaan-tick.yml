# هر چند دقیقه یه پیام tick توی کانال خصوصی می‌ذاره تا دیدبان کارهای زمان‌بندی‌شده‌ش رو اجرا کنه.
# توکن بات کمکی و آیدی کانال فقط توی Secrets خود GitHub هستن، نه توی این فایل.
name: didbaan-tick
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: didbaan-tick
  cancel-in-progress: false
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send tick
        env:
          HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          TICK_CHANNEL_ID: ${{ secrets.TICK_CHANNEL_ID }}
        run: |
          if [ -z "$HELPER_BOT_TOKEN" ] || [ -z "$TICK_CHANNEL_ID" ]; then echo "secrets are missing"; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "https://api.telegram.org/bot${HELPER_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TICK_CHANNEL_ID}" \
            -d text="tick ${GITHUB_RUN_ID}" \
            -d disable_notification=true)
          echo "telegram answered: ${code}"
          test "${code}" = "200"
