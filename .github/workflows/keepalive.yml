# GitHub زمان‌بندی مخزنی که ۶۰ روز بی‌فعالیت بمونه رو خاموش می‌کنه.
# این کار ماهی دو بار یه فایل کوچیک رو به‌روز می‌کنه تا مخزن فعال بمونه.
name: keepalive
on:
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Touch file
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "keepalive" || exit 0
          git push
